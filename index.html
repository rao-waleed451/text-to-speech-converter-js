<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to speech converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="output.css">
    <script defer src="script.js"></script>
</head>

<body class="bg-slate-500 flex items-center h-screen">
    <main class="size-full flex justify-center items-center">
        <div class=" [&>*]:m-4 flex-col items-center">

            <div class="flex items-center text-5xl font-bold tracking-wider justify-center mb-3">
                <h1>Text to Speech</h1> <span class="text-4xl text-orange-500 btn tracking-wider">Converter</span>
            </div>
            <div class="flex justify-center">
                <textarea class="para w-180 h-70 bg-amber-100 rounded-2xl p-5 outline-none focus:ring-indigo-400  focus:ring-3 shadow-4xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.7)] ">
                
            </textarea>
            </div>
            <div class="flex"><select style="background-image: url(images/down-arrow.webp);" class="bg-white/20 backdrop-blur-md flex-1 mr-5 font-bold  flex justify-between px-8 rounded-3xl items-center p-3 outline-none appearance-none bg-[url('images/dropdown.png')] bg-no-repeat bg-[length:20px] bg-[position:calc(100%-20px)_16px]">
                <option value="one">one</option>
                <option value="two">two</option>
            </select> <button class="btns bg-orange-500 font-bold text-white px-9 py-3 rounded">right </button></div>

        </div>
    </main>

</body>

</html>
